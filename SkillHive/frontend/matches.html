<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Matches - SkillHive</title><link rel="stylesheet" href="css/style.css"><style>.navbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;flex-wrap:wrap;gap:10px}.navbar-links{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.navbar-links a{text-decoration:none;color:var(--text-color)}.navbar-links a.active{color:var(--primary)}.page{max-width:900px;margin:30px auto;padding:0 16px}.page .card{margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.big{font-size:28px;font-weight:700}.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}.item{padding:12px 0;border-bottom:1px solid var(--border-color)}.item:last-child{border-bottom:0}.muted{color:var(--text-muted)}.chip{display:inline-block;padding:4px 10px;margin:3px;border:1px solid var(--border-color);border-radius:20px;font-size:13px}.chip button{background:none;border:0;color:var(--danger);cursor:pointer}</style></head><body>
<nav class="navbar"><a class="navbar-brand" href="dashboard.html">SkillHive</a><div class="navbar-links"><a href="dashboard.html">Dashboard</a><a href="matches.html" class="active">Matches</a><a href="skills.html">My Skills</a><a href="connections.html">Connections</a><a href="sessions.html">Sessions</a><a href="reviews.html">Reviews</a><a href="profile.html">Profile</a><button class="theme-toggle" onclick="toggleTheme()">🌓</button><button class="btn btn-outline" onclick="logout()">Logout</button></div></nav><div id="toast-container"></div>
<div class="page"><h1>Matches</h1><div id="list">Loading...</div></div>
<script src="js/common.js"></script><script>
async function connect(id){const r=await api("connections/send.php","POST",{receiver_id:id});showToast(r.message,r.success?"success":"error");load();}
async function load(){
  const r=await api("matches/list.php","GET");const m=(r.data&&r.data.matches)||[];
  const lab={accepted:"Connected",pending_sent:"Request sent",pending_received:"Wants to connect (see Connections)"};
  document.getElementById("list").innerHTML=m.length?m.map(x=>'<div class="card"><div class="flex-between"><h3>'+esc(x.name)+'</h3><span><span class="badge">'+esc(x.match_type)+'</span> <span class="badge">'+x.score+'% match</span></span></div><div class="muted">'+esc(x.department)+(x.year?' · '+esc(x.year):'')+' · '+esc(x.mode_preference)+'</div>'+(x.bio?'<p>'+esc(x.bio)+'</p>':'')+'<ul>'+x.reasons.map(t=>'<li>'+esc(t)+'</li>').join("")+'</ul>'+(x.connection?'<span class="badge">'+lab[x.connection]+'</span>':'<button class="btn btn-primary btn-sm" onclick="connect('+x.user_id+')">Connect</button>')+'</div>').join(""):'<div class="card empty-state">No matches yet. Add skills you can teach and want to learn on the My Skills page.</div>';
}
function init(){load();}
async function boot(){initTheme();const r=await api("auth/me.php","GET");if(!r.success){location.href="login.html";return;}const u=r.data.user||r.data;if(u.onboarding_complete==0){location.href="onboarding.html";return;}init(u);}
function esc(s){return String(s==null?"":s).replace(/[&<>"\x27]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\x27":"&#39;"}[c]));}
boot();
</script></body></html>
